name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:quota
      - run: npm run test
      # The guard ships as a default-disabled package inside this extension and its tests
      # substitute a fake runtime, so Vitest never exercises it (vitest.config.mts excludes
      # quota-guard/**). Run its own Node suite and mutation checks here, or a green CI says
      # nothing about it.
      - name: Quota guard suite
        run: npm run test:quota
      - name: Quota guard mutation checks
        run: npm run mutate:quota

  # Keep an explicit peer-floor canary separate from the default build. Today both resolve to
  # 1.5.0; retaining this job makes a future dev pin upgrade prove the advertised minimum still
  # works before that minimum is raised.
  compat-floor-pi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install floor Pi
        run: npm install --no-save @earendil-works/pi-coding-agent@1.5.0 @earendil-works/pi-ai@1.5.0 @earendil-works/pi-tui@1.5.0
      - name: Typecheck against floor Pi
        run: npm run typecheck
      - name: Test suite against floor Pi
        run: npx vitest run --reporter=dot
      - name: Quota guard floor host conformance
        env:
          PI_HOST_PATH: ${{ github.workspace }}/node_modules/@earendil-works/pi-coding-agent
        run: npm run check:quota-host
      - name: Quota guard floor runtime contract
        env:
          PI_HOST_PATH: ${{ github.workspace }}/node_modules/@earendil-works/pi-coding-agent
        run: node --test --test-timeout=10000 test/quota-guard/host-contract.test.ts

  # Forward canary: reinstall whatever Pi is `latest` over the pin, so a release newer than
  # the supported baseline surfaces here before it reaches users. It runs the full typecheck
  # and suite; continue-on-error reports drift without making an unreviewed latest release a
  # hard support guarantee.
  compat-latest-pi:
    runs-on: ubuntu-latest
    continue-on-error: true # current Pi is not a hard support guarantee; surface breakage without blocking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install current Pi
        run: npm install --no-save @earendil-works/pi-coding-agent@latest @earendil-works/pi-ai@latest @earendil-works/pi-tui@latest
      - name: Typecheck against current Pi
        run: npm run typecheck
      - name: Test suite against current Pi
        run: npx vitest run --reporter=dot
      # Host conformance: the guard gates traffic by injecting a per-request `fetch`, and
      # whether that fetch reaches the final built request is the seam whose silent failure
      # would dispatch unguarded. This job is the forward canary, so it is where a host
      # change should surface first. The supported floor runs the same contracts in
      # compat-floor-pi; this job catches forward drift without making `latest` a hard guarantee.
      - name: Quota guard host conformance
        env:
          PI_HOST_PATH: ${{ github.workspace }}/node_modules/@earendil-works/pi-coding-agent
        run: npm run check:quota-host
      - name: Quota guard runtime contract
        env:
          PI_HOST_PATH: ${{ github.workspace }}/node_modules/@earendil-works/pi-coding-agent
        run: node --test --test-timeout=10000 test/quota-guard/host-contract.test.ts
